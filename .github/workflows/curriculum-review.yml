name: Curriculum source review
on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/check-curriculum.mjs
