name: App quality
on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test -- --runInBand
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
